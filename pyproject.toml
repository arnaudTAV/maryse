[project]
name = "prepress-mcp"
version = "0.2.0"
description = "Self-hosted, multi-tenant MCP server exposing a professional prepress image-resolution check."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prepress MCP" }]
dependencies = [
    "fastmcp>=3.0,<4",
    "pymupdf>=1.24",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
prepress-mcp = "prepress_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prepress_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
